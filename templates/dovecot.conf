# Dovecot 2.3 only. No vendor include hierarchy or password debug logging.
protocols = imap lmtp
listen = *, ::
base_dir = /run/dovecot/
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = <@@CERTIFICATE@@
ssl_key = <@@PRIVATE_KEY@@
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu
auth_username_chars = abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._+-@#
auth_failure_delay = 3 secs
auth_verbose = yes
auth_verbose_passwords = no
auth_debug = no
auth_debug_passwords = no
mail_debug = no
log_path = syslog
syslog_facility = mail
mail_home = /var/vmail/%d/%n
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 2000
mail_plugins = quota
passdb {
  driver = sql
  args = /etc/dovecot/mail-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/mail-sql.conf.ext
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_limit = 256
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 10
}
protocol lmtp {
  postmaster_address = postmaster@@@DOMAIN@@
  mail_plugins = $mail_plugins
}
plugin {
  quota = maildir:User quota
  quota_rule = *:storage=@@QUOTA_MB@@M
  quota_grace = 10%%
}
namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
