driver = mysql
connect = host=/var/lib/mysql/mysql.sock dbname=postfixadmin user=mail_auth password=@@AUTH_PASSWORD@@
default_pass_scheme = SHA512-CRYPT
password_query = SELECT m.username AS user, IF('%u'=m.username,m.password,t.password) AS password FROM mailbox m JOIN domain d ON d.domain=m.domain LEFT JOIN mail_device_credential t ON t.username=m.username AND CONCAT(m.username,'#',t.id)='%u' AND t.revoked=0 AND t.expires_at>NOW() WHERE m.active=1 AND d.active=1 AND ('%s' != 'smtp' OR m.smtp_active=1) AND m.username REGEXP '^[a-z0-9][a-z0-9._+-]*@[a-z0-9.-]+$' AND ((m.username='%u' AND '%r' IN ('127.0.0.1','::1')) OR t.id IS NOT NULL)
user_query = SELECT 2000 AS uid, 2000 AS gid, CONCAT('/var/vmail/', m.domain, '/', SUBSTRING_INDEX(m.username,'@',1)) AS home, CONCAT('*:bytes=', IF(m.quota > 0, m.quota, @@QUOTA_BYTES@@)) AS quota_rule FROM mailbox m JOIN domain d ON d.domain=m.domain WHERE m.username='%u' AND m.active=1 AND d.active=1 AND m.username REGEXP '^[a-z0-9][a-z0-9._+-]*@[a-z0-9.-]+$'
iterate_query = SELECT m.username AS user FROM mailbox m JOIN domain d ON d.domain=m.domain WHERE m.active=1 AND d.active=1
