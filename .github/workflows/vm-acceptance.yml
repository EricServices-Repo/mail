name: Disposable Rocky VM acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vm:
    environment: mail-security-lab
    runs-on: [self-hosted, Linux, eric-mail-disposable]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Provision disposable lab only
        env:
          ERIC_MAIL_DISPOSABLE_LAB: I_ACCEPT_DESTRUCTIVE_LAB_PROVISIONING
        run: sudo --preserve-env=ERIC_MAIL_DISPOSABLE_LAB ./tests/vm-acceptance.sh
