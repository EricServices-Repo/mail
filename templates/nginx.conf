user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  sendfile on;
  client_max_body_size 30m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  limit_req_zone $binary_remote_addr zone=mail_login:10m rate=10r/m;
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
  }
  server {
    listen 80;
    listen [::]:80;
    server_name @@HOSTNAME@@ @@ADMIN_HOSTNAME@@;
    return 308 https://$host$request_uri;
  }
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @@HOSTNAME@@;
    ssl_certificate @@CERTIFICATE@@;
    ssl_certificate_key @@PRIVATE_KEY@@;
    root /opt/eric-mail/apps/roundcube;
    index index.php;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location ~ ^/(config|temp|logs|SQL|bin|installer|vendor)(/|$) { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(bak|old|sql|ini|log|dist|sh|json|lock)$ { deny all; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
      limit_req zone=mail_login burst=50 nodelay;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_param HTTPS on;
      fastcgi_pass unix:/run/php-fpm/roundcube.sock;
    }
    location ~ \.php$ { deny all; }
  }
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @@ADMIN_HOSTNAME@@;
    ssl_certificate @@CERTIFICATE@@;
    ssl_certificate_key @@PRIVATE_KEY@@;
    ssl_client_certificate @@ADMIN_CLIENT_CA@@;
    ssl_verify_client on;
    ssl_verify_depth 3;
    ssl_crl @@ADMIN_CLIENT_CRL@@;
@@ADMIN_ALLOW@@
    deny all;
    root /opt/eric-mail/apps/postfixadmin/public;
    index index.php;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location ~ ^/(setup|upgrade)\.php$ { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(bak|old|sql|ini|log|dist|sh|json|lock)$ { deny all; }
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
      limit_req zone=mail_login burst=20 nodelay;
      try_files $uri =404;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param HTTPS on;
      fastcgi_pass unix:/run/php-fpm/postfixadmin.sock;
    }
  }
}
