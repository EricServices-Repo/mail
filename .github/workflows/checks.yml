name: Security and configuration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install distribution check tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck php-cli
      - name: Syntax, generated PHP and security regressions
        run: ./tests/check.sh
  sql-replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Isolated MariaDB mutual TLS and replication integration
        env:
          ERIC_MAIL_SQL_INTEGRATION: '1'
        run: python3 -m unittest discover -s tests -p test_replication_integration.py -v
