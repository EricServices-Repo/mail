[@@POOL@@]
user = @@POOL@@
group = @@POOL@@
listen = /run/php-fpm/@@POOL@@.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0600
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500
clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = syslog
php_admin_flag[expose_php] = off
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Lax
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[session.save_path] = /var/lib/@@POOL@@/sessions
php_admin_value[upload_tmp_dir] = /var/lib/@@POOL@@/temp
php_admin_value[upload_max_filesize] = 24M
php_admin_value[post_max_size] = 30M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
